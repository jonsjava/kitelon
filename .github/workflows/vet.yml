name: vet

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan dependencies with vet
        uses: safedep/vet-action@v1
        with:
          version: v1.19.0
          add-step-summary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
