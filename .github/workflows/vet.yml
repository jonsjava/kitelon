name: vet

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # vet-action only scans push and pull_request events. It throws on
      # workflow_dispatch and is a no-op on schedule, so skip it when called
      # from docker-weekly (scheduled or manual). Push/PR runs still scan.
      - name: Scan dependencies with vet
        if: contains(fromJSON('["push", "pull_request", "pull_request_target"]'), github.event_name)
        uses: safedep/vet-action@v1.1.12
        with:
          version: v1.19.0
          add-step-summary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
