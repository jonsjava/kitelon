name: docker-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. v0.5.1). Leave blank to use v + the VERSION file."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  vet:
    uses: ./.github/workflows/vet.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write

  clamav:
    uses: ./.github/workflows/malware-scan.yml
    permissions:
      contents: read

  publish:
    needs: [test, vet, clamav]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_VERSION" ]]; then
            tag="$INPUT_VERSION"
          else
            tag="v$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ ! "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid image tag '$tag' (expected v<version>)"; exit 1
          fi
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Image tag: $tag"

      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/local/julia*
          sudo docker image prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            jonsjava/kitelon:latest
            jonsjava/kitelon:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jonsjava/kitelon:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          trivy-config: trivy.yaml

      - name: Push image
        run: |
          docker push jonsjava/kitelon:latest
          docker push jonsjava/kitelon:${{ env.IMAGE_TAG }}
