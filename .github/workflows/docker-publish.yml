name: docker-publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  checks: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Wait for CI checks
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-regexp: ^(test|vet|clamav)$
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            jonsjava/kitelon:latest
            jonsjava/kitelon:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: jonsjava/kitelon:${{ github.ref_name }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Push image
        run: |
          docker push jonsjava/kitelon:latest
          docker push jonsjava/kitelon:${{ github.ref_name }}
