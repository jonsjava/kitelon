name: docker-publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  vet:
    uses: ./.github/workflows/vet.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write

  clamav:
    uses: ./.github/workflows/malware-scan.yml
    permissions:
      contents: read

  publish:
    needs: [test, vet, clamav]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            jonsjava/kitelon:latest
            jonsjava/kitelon:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jonsjava/kitelon:${{ github.ref_name }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          trivy-config: trivy.yaml

      - name: Push image
        run: |
          docker push jonsjava/kitelon:latest
          docker push jonsjava/kitelon:${{ github.ref_name }}
