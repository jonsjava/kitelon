# Docker image config (copied to /usr/share/kitelon/kitelon.conf during install).
# Secrets: set DB_PASSWORD at runtime (see docker/env.example).

INSTALL_DIR="/usr/share/kitelon"
PLUGINS_DIR="$INSTALL_DIR/plugins"
WORDLIST_DIR="$INSTALL_DIR/wordlists"

KL_C_INFO='\033[94m'
KL_C_ERR='\033[91m'
KL_C_OK='\033[92m'
KL_C_WARN='\033[93m'
KL_RESET='\e[0m'

ENABLE_AUTO_UPDATES="0"
REPORT="0"
LOOT="1"
LOOT_DB="1"
LOOT_REPORT="1"
MAX_HOSTS="2000"
THREADS="10"
OUT_OF_SCOPE=()

ENABLE_NUCLEI="1"
ENABLE_TESTSSL="1"
ENABLE_DIRSEARCH="1"
ENABLE_GOBUSTER="1"
ENABLE_FFUF="0"
ENABLE_WEBTECH="1"
ENABLE_GOWITNESS="1"
ENABLE_NIKTO="0"
ENABLE_HTTPX="1"
ENABLE_SUBFINDER="1"
ENABLE_WAFW00F="1"
ENABLE_VULNERS="1"
ENABLE_OS_DETECT="1"
ENABLE_ENUM4LINUX="1"
ENABLE_SMBMAP="1"
ENABLE_SSH_AUDIT="1"
ENABLE_NAABU="0"
ENABLE_DNSX="1"
ENABLE_KATANA="0"
ENABLE_TLSX="0"
ENABLE_METASPLOIT="1"
MSF_MODULE_TIMEOUT="420"
MSF_MAX_MODULES="12"
NUCLEI_TEMPLATES="$PLUGINS_DIR/nuclei-templates"

DB_ENABLED="1"
DB_HOST="postgres"
DB_PORT="5432"
DB_NAME="kitelon"
DB_USER="kitelon"
LOOT_ARTIFACTS_DB="1"
LOOT_FS_MIRROR="1"
WEB_BIND="0.0.0.0"
WEB_PORT="8080"

WORKER_ROLE="both"
WORKER_POLL_SEC="10"
WORKER_POST_CONCURRENCY="2"

SHODAN_API_KEY=""
CENSYS_APP_ID=""
CENSYS_API_SECRET=""
HUNTERIO_KEY=""
GITHUB_API_KEY=""
WP_API_KEY=""

BURP_HOST="127.0.0.1"
BURP_PORT="1338"
OPENVAS="0"
NESSUS="0"
SLACK_NOTIFICATIONS="0"

BROWSER=""

LOG_ENABLED="1"
LOG_DIR="/var/log/kitelon"
LOG_LEVEL="INFO"
LOG_MAX_BYTES="10485760"
LOG_BACKUP_COUNT="5"
LOG_STDERR="1"
