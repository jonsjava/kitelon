# Kitelon main configuration (bash-sourced by the kitelon CLI and worker).
#
# Install / deploy:
#   - Run install.sh without kitelon.conf: it will prompt and create one for you.
#
# Runtime paths (Linux):
#   /root/.kitelon.conf         : live config (symlinked under /usr/share/kitelon/conf/)
#   /root/.kitelon_db.conf      : DB password only (chmod 600; never commit)
#   /root/.kitelon_api_keys.conf: optional API keys (never commit)
#
# Values in /root/.kitelon.conf override the copy under INSTALL_DIR.

# Base install path on the system (default layout from install.sh).
INSTALL_DIR="/usr/share/kitelon"
# Directory where third-party tool repos are cloned during install.
PLUGINS_DIR="$INSTALL_DIR/plugins"
# Wordlists fetched or shipped with Kitelon (gobuster, dirsearch, etc.).
WORDLIST_DIR="$INSTALL_DIR/wordlists"

# Terminal colour codes (Kitelon UI: see bin/kitelon_ui.sh).
KL_C_INFO='\033[94m'
KL_C_ERR='\033[91m'
KL_C_OK='\033[92m'
KL_C_WARN='\033[93m'
KL_RESET='\e[0m'

# --- Core behaviour ---

# Pull updates from git when running kitelon -u (0 = off, 1 = on).
ENABLE_AUTO_UPDATES="0"
# Open HTML report in BROWSER after a scan completes (0 = off, 1 = on).
REPORT="1"
# Run loot import/report steps after scans (0 = skip all post-scan processing).
LOOT="1"
# Import scan results into PostgreSQL when LOOT=1 and DB_ENABLED=1.
LOOT_DB="1"
# Regenerate HTML/CSV reports when LOOT=1.
LOOT_REPORT="1"
# Maximum hosts processed in mass/discover-style modes.
MAX_HOSTS="2000"
# Default parallelism hint for tools that support it.
THREADS="10"
# Bash array of regex patterns; matching targets are skipped (out of scope).
OUT_OF_SCOPE=()

# --- Scan engine (Python pipelines) ---

# Run nuclei template scans against discovered web URLs.
ENABLE_NUCLEI="1"
# Run testssl.sh against HTTPS ports and archive TLS findings.
ENABLE_TESTSSL="1"
# Run dirsearch path brute-force (Python tool under PLUGINS_DIR).
ENABLE_DIRSEARCH="1"
# Run gobuster path brute-force (preferred when both dir tools enabled).
ENABLE_GOBUSTER="1"
# Run ffuf path discovery (parallel to dirsearch; off by default).
ENABLE_FFUF="0"
# Fingerprint web stacks with webtech (replaces whatweb in the Python engine).
ENABLE_WEBTECH="1"
# Capture gowitness screenshots for live HTTP(S) ports.
ENABLE_GOWITNESS="1"
# Run nikto against live web ports (slow; off by default).
ENABLE_NIKTO="0"
# Probe HTTP(S) services with projectdiscovery httpx.
ENABLE_HTTPX="1"
# Enumerate subdomains with subfinder during recon pipelines.
ENABLE_SUBFINDER="1"
# Detect web application firewalls with wafw00f.
ENABLE_WAFW00F="1"
# Run nmap vulners NSE script for CVE correlation on service versions.
ENABLE_VULNERS="1"
# Enable nmap -O OS fingerprinting (disabled automatically in stealth mode).
ENABLE_OS_DETECT="1"
# SMB enumeration when port 445 is open.
ENABLE_ENUM4LINUX="1"
ENABLE_SMBMAP="1"
# SSH configuration audit when port 22 is open.
ENABLE_SSH_AUDIT="1"
# Fast port discovery with naabu before nmap (off by default).
ENABLE_NAABU="0"
# Validate recon subdomains with dnsx.
ENABLE_DNSX="1"
# Crawl URLs with katana before nuclei (off by default).
ENABLE_KATANA="0"
# Lightweight TLS probe with tlsx (off by default; testssl is primary).
ENABLE_TLSX="0"
ENABLE_METASPLOIT="1"

# --- OSINT / recon (0.3.5) ---
# Conservative defaults; raise limits or use preset osint-deep for lab work.
ENABLE_DNSRECON="1"
ENABLE_METAGOOFILE="0"
ENABLE_GAU="1"
ENABLE_SHODAN="1"
ENABLE_CENSYS="1"
SHODAN_MAX_RESULTS="25"
CENSYS_MAX_RESULTS="25"
CENSYS_MODE="hosts"
GAU_MAX_URLS="500"
GAU_PROVIDERS="wayback"
GAU_INCLUDE_SUBS="1"
METAGOOFILE_LIMIT="25"
METAGOOFILE_TYPES="pdf,doc,xls"
DNSRECON_AXFR="0"
DNSRECON_TIMEOUT="300"
METAGOOFILE_TIMEOUT="600"
GAU_TIMEOUT="300"
SHODAN_TIMEOUT="60"
CENSYS_TIMEOUT="60"

MSF_MODULE_TIMEOUT="420"
MSF_MAX_MODULES="12"
# Path to nuclei template directory (updated by install.sh).
NUCLEI_TEMPLATES="$PLUGINS_DIR/nuclei-templates"

# --- Database / Web UI ---

# Enable PostgreSQL-backed workspaces, jobs, schedules, and Web UI (0 = off).
DB_ENABLED="1"
# PostgreSQL server hostname or socket path.
DB_HOST="127.0.0.1"
# PostgreSQL port.
DB_PORT="5432"
# Database name created for Kitelon loot and job metadata.
DB_NAME="kitelon"
# PostgreSQL role used by Kitelon (password goes in /root/.kitelon_db.conf).
DB_USER="postgres"
# Archive loot files into PostgreSQL on import (system of record).
LOOT_ARTIFACTS_DB="1"
# Mirror DB-stored artifacts back to the workspace loot directory on disk.
LOOT_FS_MIRROR="1"
# IP address the Web UI/API binds to (127.0.0.1 = local only).
WEB_BIND="127.0.0.1"
# TCP port for the Web UI and REST API.
WEB_PORT="8080"

# --- Job worker ---

# Worker pool: both | scan | post (scan jobs vs loot/report jobs).
WORKER_ROLE="both"
# Seconds between worker poll ticks when no job is running.
WORKER_POLL_SEC="10"
# Max concurrent post-scan jobs (loot import, report generation).
WORKER_POST_CONCURRENCY="2"

# --- API keys (optional) ---
# Prefer /root/.kitelon_api_keys.conf for secrets; leave blank here.

# Shodan API key for OSINT modules.
SHODAN_API_KEY=""
# Censys API credentials for subdomain / cert search.
CENSYS_APP_ID=""
CENSYS_API_SECRET=""
# Hunter.io email discovery API key.
HUNTERIO_KEY=""
# GitHub token for repo/secret scanning integrations.
GITHUB_API_KEY=""
# WPScan API token for WordPress checks.
WP_API_KEY=""

# --- Integrations (optional) ---

# Burp Suite proxy host for passive/active integration hooks.
BURP_HOST="127.0.0.1"
# Burp Suite proxy port.
BURP_PORT="1338"
# Enable OpenVAS import hooks (0 = off).
OPENVAS="0"
# Enable Nessus import hooks (0 = off).
NESSUS="0"
# Send Slack notifications on scan events (0 = off).
SLACK_NOTIFICATIONS="0"

# --- Desktop ---

# Browser executable opened for HTML reports (must be on PATH).
BROWSER="firefox"

# --- Logging ---

# Write service logs to LOG_DIR (0 = off).
LOG_ENABLED="1"
# Directory for cli.log, api.log, worker.log, engine.log, core.log.
LOG_DIR="/var/log/kitelon"
# DEBUG, INFO, WARNING, ERROR
LOG_LEVEL="INFO"
# Rotating log file size and retention.
LOG_MAX_BYTES="10485760"
LOG_BACKUP_COUNT="5"
# Mirror log lines to stderr as well as log files (1 = on).
LOG_STDERR="1"
# Persistent kitelon-cli command history (up-arrow); override path if needed.
# KITELON_CLI_HISTORY="/root/.local/share/kitelon/cli_history"
