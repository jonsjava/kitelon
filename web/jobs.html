<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitelon: Jobs</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="app-header"></header>
  <main>
    <form id="enqueue" class="scan-form">
      <h2 class="section-heading">Enqueue scan</h2>
      <label>Workspace
        <input name="workspace" data-workspace-input required placeholder="myscope">
        <span class="field-hint">Letters, digits, . _ - only</span>
      </label>
      <label>Target<input name="target" required placeholder="example.com"></label>
      <label>Mode
        <select name="mode" id="scan-mode"></select>
      </label>
      <label>Priority
        <input name="priority" type="number" value="100" min="1" max="9999">
        <span class="field-hint">Lower runs sooner</span>
      </label>
      <fieldset class="scan-options-fieldset">
        <legend>Scan options</legend>
        <div id="scan-options"></div>
      </fieldset>
      <button type="submit">Enqueue</button>
    </form>

    <form id="reimport" class="panel-form">
      <h2 class="section-heading">Import workspace loot</h2>
      <label>Workspace
        <input name="workspace" data-workspace-input required placeholder="phase1-test">
      </label>
      <button type="submit">Queue import + report</button>
    </form>

    <section class="jobs-section">
      <div class="page-toolbar">
        <h2 class="page-title">Recent jobs</h2>
        <span id="jobs-refresh-hint" class="meta">Auto-refresh every 15s</span>
      </div>
      <div class="table-wrap">
        <table class="jobs-table">
          <thead>
            <tr><th>ID</th><th>Status</th><th>Type</th><th>Workspace</th><th>Target</th><th>Mode</th><th>Priority</th><th>Error</th><th></th></tr>
          </thead>
          <tbody id="jobs"></tbody>
        </table>
      </div>
    </section>
    <p id="error" class="error"></p>
  </main>
  <script src="/static/app.js"></script>
  <script src="/static/jobs.js"></script>
  <script>
    const {
      api, renderNav, validateWorkspaceAlias, sanitizeWorkspaceAlias,
      scanOptionsFromForm, renderScanOptions, fillModeSelect,
    } = KitelonUI;
    const { syncJobsTable } = KitelonJobs;

    renderNav("jobs", "Job queue");

    function workspaceFromForm(fd) {
      const value = sanitizeWorkspaceAlias(fd.get("workspace"));
      const err = validateWorkspaceAlias(value);
      if (err) throw new Error(err);
      return value;
    }

    function showError(message) {
      document.getElementById("error").textContent = message || "";
    }

    async function loadScanConfig() {
      const cfg = await api("/api/v1/scan-config");
      fillModeSelect(document.getElementById("scan-mode"), cfg.modes);
      renderScanOptions(document.getElementById("scan-options"), cfg.options, "job");
    }

    async function loadJobs() {
      const tbody = document.getElementById("jobs");
      showError("");
      try {
        const jobs = await api("/api/v1/jobs?limit=50");
        syncJobsTable(tbody, jobs, api, showError, loadJobs);
      } catch (e) {
        showError(e.message);
      }
    }

    document.getElementById("enqueue").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const fd = new FormData(ev.target);
      try {
        const workspace = workspaceFromForm(fd);
        const options = scanOptionsFromForm(ev.target);
        await api("/api/v1/jobs", {
          method: "POST",
          body: JSON.stringify({
            job_type: "scan",
            workspace,
            target: fd.get("target"),
            mode: fd.get("mode"),
            priority: parseInt(fd.get("priority"), 10) || 100,
            options,
            created_by: "web-ui",
          }),
        });
        loadJobs();
      } catch (e) {
        showError(e.message);
      }
    });

    document.getElementById("reimport").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const fd = new FormData(ev.target);
      try {
        const workspace = workspaceFromForm(fd);
        await api("/api/v1/workspaces/" + encodeURIComponent(workspace) + "/import", {
          method: "POST",
          body: "{}",
        });
        loadJobs();
      } catch (e) {
        showError(e.message);
      }
    });

    loadScanConfig().then(loadJobs);
    setInterval(loadJobs, 15000);
  </script>
</body>
</html>
