<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitelon: Workspaces</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="app-header"></header>
  <main>
    <div id="summary-strip" class="summary-strip" aria-label="Workspace summary"></div>

    <div class="page-toolbar">
      <h2 class="page-title">Workspaces</h2>
      <button type="button" id="panel-toggle" class="secondary btn-sm" aria-expanded="true">
        Manage workspaces
      </button>
    </div>

    <div id="workspace-panel" class="workspace-panel">
      <form id="create-workspace" class="panel-form">
        <h3>New workspace</h3>
        <label>Alias
          <input name="alias" data-workspace-input required placeholder="myscope">
          <span class="field-hint">Letters, digits, . _ - only (no spaces)</span>
        </label>
        <button type="submit">Create</button>
      </form>
      <div class="import-zip-row panel-form">
        <h3>Import workspace ZIP</h3>
        <label>ZIP file
          <input type="file" id="import-zip-file" accept=".zip,application/zip">
        </label>
        <label>Alias override (optional)
          <input type="text" id="import-zip-alias" data-workspace-input placeholder="leave blank to use zip">
        </label>
        <label class="option-item inline-check">
          <input type="checkbox" id="import-zip-replace"> Replace existing
        </label>
        <button type="button" id="import-zip-btn" class="secondary">Import ZIP</button>
      </div>
      <p id="import-zip-msg" class="meta"></p>
    </div>

    <div id="grid" class="card-grid workspace-grid"></div>
    <p id="error" class="error"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/charts.js"></script>
  <script src="/static/workspaces.js"></script>
  <script>KitelonWorkspaces.bindWorkspacePage();</script>
</body>
</html>
